name: Deploy Node

# Runs after the Docker image has been built and published.
# Triggered by the "Docker released" workflow completing on a tag.
on:
  workflow_run:
    workflows: ["Docker released"]
    types:
      - completed

concurrency:
  group: deploy-node
  cancel-in-progress: false

jobs:
  deploy-node1:
    # Only run if the triggering workflow succeeded and was triggered by a tag
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.read-tag.outputs.tag }}

    steps:
      - name: Download release tag artifact
        uses: actions/download-artifact@v4
        with:
          name: release-tag
          path: /tmp/release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read release tag
        id: read-tag
        run: |
          TAG=$(cat /tmp/release/tag.txt)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Deploy to node1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_1 }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/voiceban
            NODE_IMAGE="ghcr.io/cloud3-foundation/node:${{ steps.read-tag.outputs.tag }}" \
              bash /opt/cloud/scripts/node/update.sh

      - name: Record failure
        if: failure()
        run: |
          echo "### Deploy failed on vban1" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the SSH step output above for details." >> "$GITHUB_STEP_SUMMARY"

  deploy-node2:
    needs: deploy-node1
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to vban2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_2 }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/voiceban
            NODE_IMAGE="ghcr.io/cloud3-foundation/node:${{ github.event.workflow_run.head_branch }}" \
              bash /opt/cloud/scripts/node/update.sh

      - name: Record failure
        if: failure()
        run: |
          echo "### Deploy failed on vban2" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the SSH step output above for details." >> "$GITHUB_STEP_SUMMARY"

  summary:
    runs-on: ubuntu-latest
    needs: [deploy-node1, deploy-node2]
    if: always()
    steps:
      - name: Write deployment summary
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          RESULT_1="${{ needs.deploy-node1.result }}"
          RESULT_2="${{ needs.deploy-node2.result }}"
          echo "### Node Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **vban1:** $RESULT_1" >> "$GITHUB_STEP_SUMMARY"
          echo "- **vban2:** $RESULT_2" >> "$GITHUB_STEP_SUMMARY"
